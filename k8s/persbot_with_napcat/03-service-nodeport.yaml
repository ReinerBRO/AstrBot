apiVersion: v1
kind: Service
metadata:
  name: persbot-service-nodeport
  namespace: persbot-ns
  labels:
    app: persbot-stack
spec:
  type: NodePort
  selector:
    app: persbot-stack
  ports:
    - name: napcat-web
      port: 6099
      targetPort: 6099
      # nodePort: 30099 # Optional: Specify a fixed NodePort if needed, otherwise remove this line
    - name: persbot-web
      port: 6185
      targetPort: 6185
      # nodePort: 30185 # Optional: Specify a fixed NodePort if needed, otherwise remove this line