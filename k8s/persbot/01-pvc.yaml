apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persbot-data-pvc
  namespace: persbot-standalone-ns
  labels:
    app: persbot-standalone
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard # uncomment and set proper StorageClass