# 当接入 QQ NapCat 时，请使用这个 compose 文件一键部署: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/persbot.yml

services:
  persbot:
    image: soulter/persbot:latest
    container_name: persbot
    restart: always
    ports: # mappings description: https://github.com/PersbotDevs/Persbot/issues/497
      - "6185:6185" # 必选，Persbot WebUI 端口
      - "6199:6199" # 可选, QQ 个人号 WebSocket 端口
      # - "6195:6195" # 可选, 企业微信 Webhook 端口
      # - "6196:6196" # 可选, QQ 官方接口 Webhook 端口
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/Persbot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
